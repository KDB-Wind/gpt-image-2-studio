  <text x="600" y="459" fill="#8b6b22" font-family="Arial, sans-serif" font-size="13">拖拽上传</text>
  <rect x="322" y="506" width="368" height="34" rx="17" fill="url(#hero)"/>
  <text x="464" y="528" fill="#2e2518" font-family="Arial, sans-serif" font-size="15" font-weight="700">开始生成</text>

  <rect x="758" y="168" width="348" height="382" rx="26" fill="#fffaf0" stroke="#e7d8b4"/>
  <text x="790" y="210" fill="#342819" font-family="Arial, sans-serif" font-size="22" font-weight="700">预览与历史</text>
  <rect x="790" y="234" width="284" height="190" rx="24" fill="#e7efe0"/>
  <path d="M824 390 C862 338, 898 356, 928 318 C958 280, 1008 284, 1044 250 L1044 390 Z" fill="#96b889"/>
  <circle cx="842" cy="270" r="32" fill="#f8d777"/>
  <rect x="790" y="446" width="132" height="58" rx="16" fill="#fffdf9" stroke="#eadbbd"/>
