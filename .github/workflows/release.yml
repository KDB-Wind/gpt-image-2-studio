name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish, such as v1.2.3 (the tag must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release-metadata:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate requested tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:DISPATCH_TAG } else { $env:REF_NAME }
          $semverIdentifier = '(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $semverTagPattern = "\Av(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-$semverIdentifier(?:\.$semverIdentifier)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?\z"
          if ($tag -notmatch $semverTagPattern) {
            throw "Release tag must be v followed by a valid SemVer version."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  windows-installer:
    name: Windows installer
    needs: release-metadata
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    steps:
      - name: Checkout validated release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.release-metadata.outputs.tag }}

      - name: Verify checked-out tag commit
        shell: pwsh
        run: |
          $headCommit = git rev-parse HEAD
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG --
          if (-not $tagCommit -or $headCommit -ne $tagCommit) {
            throw "Checked-out HEAD does not match the validated release tag commit."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Resolve release metadata
        id: release_metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Validated release tag does not match package version."
          }

          $releaseNotes = "docs/release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) {
            throw "Release notes are missing: $releaseNotes"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_notes=$releaseNotes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check release readiness
        run: npm run release:check

      - name: Scan source for secrets
        run: npm run secret:scan

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Build single-file HTML
        run: npm run build:static

      - name: Check built static site
        run: npm run site:check

      - name: Run mock static E2E
        run: npm run e2e:static:mock:run

      - name: Run file-mode static E2E
        run: npm run e2e:static:file:run

      - name: Scan frontend release artifacts for secrets
        run: npm run secret:scan:release

      - name: Check Tauri Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Tauri Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installers
        run: npm run desktop:build

      - name: Scan final release artifacts for secrets
        run: npm run secret:scan:release

      - name: Generate release checksums
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if ($installerFiles.Count -eq 0) {
            throw "No Windows setup.exe installer was found."
          }

          $staticHtml = Get-Item -Path "dist-static/gpt-image-2-studio-lite.html"

          @($installerFiles) + @($staticHtml) |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path "SHA256SUMS.txt" -Encoding utf8

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-static/gpt-image-2-studio-lite.html
            SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          name: GPT-Image-2 Studio ${{ needs.release-metadata.outputs.tag }}
          body_path: ${{ steps.release_metadata.outputs.release_notes }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-static/gpt-image-2-studio-lite.html
            SHA256SUMS.txt
