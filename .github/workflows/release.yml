name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, such as v0.1.2"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check release readiness
        run: npm run release:check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Build single-file HTML
        run: npm run build:static

      - name: Check Tauri Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Tauri Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installers
        run: npm run desktop:build

      - name: Generate release checksums
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if ($installerFiles.Count -eq 0) {
            throw "No Windows setup.exe installer was found."
          }

          $staticHtml = Get-Item -Path "dist-static/gpt-image-2-studio-lite.html"

          @($installerFiles) + @($staticHtml) |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path "SHA256SUMS.txt" -Encoding utf8

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-static/gpt-image-2-studio-lite.html
            SHA256SUMS.txt

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: GPT-Image-2 Studio ${{ steps.release_tag.outputs.tag }}
          body_path: docs/release-notes/v0.1.2.md
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-static/gpt-image-2-studio-lite.html
            SHA256SUMS.txt
