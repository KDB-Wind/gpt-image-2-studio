name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      STATIC_ARCHIVE_TRUSTED_BASE: ${{ vars.STATIC_ARCHIVE_TRUSTED_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate external archive trust root
        shell: pwsh
        run: |
          if (-not $env:STATIC_ARCHIVE_TRUSTED_BASE) {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE is required. Configure it under Settings > Secrets and variables > Actions > Variables."
          }
          if ($env:STATIC_ARCHIVE_TRUSTED_BASE -notmatch '^[a-f0-9]{40}$') {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE must be a full 40-character commit SHA."
          }
          $resolvedBase = git rev-parse --verify "$env:STATIC_ARCHIVE_TRUSTED_BASE^{commit}"
          if (-not $resolvedBase -or $resolvedBase -ne $env:STATIC_ARCHIVE_TRUSTED_BASE) {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE could not be resolved exactly."
          }
          git merge-base --is-ancestor $env:STATIC_ARCHIVE_TRUSTED_BASE HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE must be HEAD or an ancestor of HEAD."
          }

      - name: Resolve additional event archive base
        id: resolve-archive-base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
            git fetch origin main
            $baseSha = git merge-base HEAD origin/main
          } else {
            $baseSha = $env:BEFORE_SHA
            if (-not $baseSha -or $baseSha -match '^0+$') {
              throw "Push event did not provide a prior commit for archive immutability."
            }
          }
          if (-not $baseSha) {
            throw "Historical archive base could not be resolved."
          }
          $resolvedBase = git rev-parse --verify "$baseSha^{commit}"
          if (-not $resolvedBase -or $resolvedBase -ne $baseSha) {
            throw "Historical event archive base could not be resolved exactly."
          }
          git merge-base --is-ancestor $baseSha HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Historical event archive base must be HEAD or an ancestor of HEAD."
          }
          if (git cat-file -e "${baseSha}:static-versions/manifest.json" 2>$null) {
            "STATIC_ARCHIVE_EVENT_BASE_REF=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Prior event commit has no static archive manifest; external trusted root remains the historical archive base."
            "STATIC_ARCHIVE_EVENT_BASE_REF=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check release readiness
        env:
          STATIC_ARCHIVE_EVENT_BASE_REF: ${{ steps.resolve-archive-base.outputs.STATIC_ARCHIVE_EVENT_BASE_REF }}
        run: npm run release:check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Build static frontend
        run: npm run build:static

      - name: Check runtime bundle isolation
        run: npm run artifact:check

      - name: Check Tauri Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Tauri Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
