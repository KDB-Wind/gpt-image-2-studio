name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve historical archive base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
            git fetch origin main
            $baseSha = git merge-base HEAD origin/main
          } else {
            $baseSha = $env:BEFORE_SHA
            if (-not $baseSha -or $baseSha -match '^0+$') {
              throw "Push event did not provide a prior commit for archive immutability."
            }
          }
          if (-not $baseSha) {
            throw "Historical archive base could not be resolved."
          }
          "STATIC_ARCHIVE_BASE_REF=$baseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check release readiness
        run: npm run release:check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Check Tauri Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Tauri Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
