name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static HTML site
    runs-on: ubuntu-latest
    env:
      STATIC_ARCHIVE_TRUSTED_BASE: ${{ vars.STATIC_ARCHIVE_TRUSTED_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate external archive trust root
        shell: pwsh
        run: |
          if (-not $env:STATIC_ARCHIVE_TRUSTED_BASE) {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE is required. Configure it under Settings > Secrets and variables > Actions > Variables."
          }
          if ($env:STATIC_ARCHIVE_TRUSTED_BASE -notmatch '^[a-f0-9]{40}$') {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE must be a full 40-character commit SHA."
          }
          $resolvedBase = git rev-parse --verify "$env:STATIC_ARCHIVE_TRUSTED_BASE^{commit}"
          if (-not $resolvedBase -or $resolvedBase -ne $env:STATIC_ARCHIVE_TRUSTED_BASE) {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE could not be resolved exactly."
          }
          git merge-base --is-ancestor $env:STATIC_ARCHIVE_TRUSTED_BASE HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Repository variable STATIC_ARCHIVE_TRUSTED_BASE must be HEAD or an ancestor of HEAD."
          }

      - name: Resolve additional push archive base
        id: resolve-archive-base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            $baseSha = $env:BEFORE_SHA
            if (-not $baseSha -or $baseSha -match '^0+$') {
              throw "Pages push did not provide a prior commit for archive immutability."
            }
            $resolvedBase = git rev-parse --verify "$baseSha^{commit}"
            if (-not $resolvedBase -or $resolvedBase -ne $baseSha) {
              throw "Pages push archive base could not be resolved exactly."
            }
            git merge-base --is-ancestor $baseSha HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Pages push archive base must be HEAD or an ancestor of HEAD."
            }
            if (git cat-file -e "${baseSha}:static-versions/manifest.json" 2>$null) {
              "STATIC_ARCHIVE_EVENT_BASE_REF=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } else {
              Write-Host "Prior push commit has no static archive manifest; external trusted root remains the historical archive base."
              "STATIC_ARCHIVE_EVENT_BASE_REF=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Build static site
        run: npm run build:static

      - name: Check runtime bundle isolation
        run: npm run artifact:check

      - name: Check Pages readiness
        env:
          STATIC_ARCHIVE_EVENT_BASE_REF: ${{ steps.resolve-archive-base.outputs.STATIC_ARCHIVE_EVENT_BASE_REF }}
        run: npm run pages:check

      - name: Run static page E2E
        run: npm run e2e:static:mock:run

      - name: Run release HTML file-mode E2E
        run: npm run e2e:static:file:run

      - name: Check static site output
        run: npm run site:check

      - name: Scan source and built static artifacts for secrets
        run: npm run secret:scan

      - name: Add Pages marker
        run: touch dist-static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
