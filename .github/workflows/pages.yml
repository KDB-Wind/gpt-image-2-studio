name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static HTML site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve historical archive base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq "push") {
            $baseSha = $env:BEFORE_SHA
            if (-not $baseSha -or $baseSha -match '^0+$') {
              throw "Pages push did not provide a prior commit for archive immutability."
            }
            "STATIC_ARCHIVE_EVENT_BASE_REF=$baseSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $releaseConfig = Get-Content -Raw "static-versions/release-config.json" | ConvertFrom-Json
            $baseSha = $releaseConfig.trustedArchiveBase
            if (-not $baseSha -or $baseSha -notmatch '^[a-f0-9]{40}$') {
              throw "Pages trusted archive anchor is missing or invalid."
            }
            "STATIC_ARCHIVE_BASE_REF=$baseSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          if (-not $baseSha) {
            throw "Pages historical archive base could not be resolved."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Build static site
        run: npm run build:static

      - name: Check runtime bundle isolation
        run: npm run artifact:check

      - name: Check Pages readiness
        run: npm run pages:check

      - name: Check historical archive immutability
        run: node scripts/release-archive-parity.mjs --historical-only

      - name: Run static page E2E
        run: npm run e2e:static:mock:run

      - name: Run release HTML file-mode E2E
        run: npm run e2e:static:file:run

      - name: Check static site output
        run: npm run site:check

      - name: Scan source and built static artifacts for secrets
        run: npm run secret:scan

      - name: Add Pages marker
        run: touch dist-static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
