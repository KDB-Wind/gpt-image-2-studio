name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static HTML site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check release readiness
        run: npm run release:check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build static site
        run: npm run build:static

      - name: Run static page E2E
        run: npm run e2e:static:mock:run

      - name: Run release HTML file-mode E2E
        run: npm run e2e:static:file:run

      - name: Check static site output
        run: npm run site:check

      - name: Scan source and built static artifacts for secrets
        run: npm run secret:scan

      - name: Add Pages marker
        run: touch dist-static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
