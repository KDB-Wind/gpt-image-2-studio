services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_to_image
      POSTGRES_USER: chat_to_image
      POSTGRES_PASSWORD: chat_to_image
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_to_image -d chat_to_image"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chat_to_image:chat_to_image@postgres:5432/chat_to_image
    volumes:
      - ./packages/platform-db/drizzle:/migrations:ro
    command: >
      sh -lc "psql $$DATABASE_URL -v ON_ERROR_STOP=1 -f /migrations/0001_platform_schema.sql"

  api:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.local.platform
    environment:
      DATABASE_URL: postgres://chat_to_image:chat_to_image@postgres:5432/chat_to_image
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - platform-outputs:/app/platform-outputs
    command: >
      sh -lc "npm ci && npm run api:dev"

  worker:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.local.platform
    environment:
      DATABASE_URL: postgres://chat_to_image:chat_to_image@postgres:5432/chat_to_image
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      GENERATION_WORKER_CONCURRENCY: 1
    volumes:
      - .:/app
      - /app/node_modules
      - platform-outputs:/app/platform-outputs
    command: >
      sh -lc "npm ci && npm run worker:dev"

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -lc "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  postgres-data:
  platform-outputs:
