[package]
name = "chat-to-image"
version = "0.1.6"
description = "Chat To Image desktop shell"
authors = ["Chat To Image"]
edition = "2021"

[lib]
name = "chat_to_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
